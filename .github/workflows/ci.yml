name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows runner configurations
          - os: ubuntu-latest
            arch: x64
            julia-version: '1'
          - os: ubuntu-latest
            arch: x64
            julia-version: 'lts'
          - os: windows-latest
            arch: x64
            julia-version: '1'
          
          # Native Apple Silicon configurations
          - os: macOS-latest
            arch: aarch64
            julia-version: '1'
          - os: macOS-latest
            arch: aarch64
            julia-version: 'lts'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - name: Resolve Manifest
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(".")
          Pkg.resolve()

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: lcov.info

